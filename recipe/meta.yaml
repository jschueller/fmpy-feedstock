{% set version = "0.3.27" %}

package:
  name: fmpy
  version: {{ version }}

source:
  url: https://pypi.org/packages/py3/f/fmpy/fmpy-{{ version }}-py3-none-any.whl
  sha256: 0c2c270dd39e4303e7200dd62626f4d80e76cda4a2ca3a8e542bd4f70522eddf
  # macOS: shasum -a 256 <file>
  # Windows: certutil -hashfile <file> SHA256

build:
  number: 0
  entry_points:
    - fmpy = fmpy.command_line:main

outputs:
  - name: fmpy-base
    script: build_base.bat  # [win]
    script: build_base.sh  # [not win]
    requirements:
      host:
        - python >=3.5
        - pip
      run:
        - python >=3.5
        - attrs
        - jinja2
        - lark
        - lxml
        - msgpack-python
        - numpy
        - pywin32  # [win]
    test:
      imports:
        - fmpy
        - fmpy.cross_check
        - fmpy.examples
        - fmpy.fmucontainer
        - fmpy.ssp
        - fmpy.sundials  # [(win and x86_64) or (osx and arm64) or (linux and x86_64)]

  - name: fmpy
    build:
      noarch: python
    requirements:
      run:
        - dash-bootstrap-components >=1.0.0
        - dask
        - matplotlib-base
        - notebook
        - plotly
        - pyqt
        - pyqtgraph
        - pyqtwebengine
        - python-kaleido
        - requests
        - scipy
        - {{ pin_subpackage('fmpy-base', max_pin="x.x.x") }}
    test:
      imports:
        - fmpy.gui
        - fmpy.webapp

about:
  home: https://github.com/CATIA-Systems/FMPy
  license: BSD-2-Clause
  license_family: BSD
  license_file: LICENSE.txt
  summary: Simulate Functional Mockup Units (FMUs) in Python
  doc_url: https://fmpy.readthedocs.io/
  dev_url: https://github.com/CATIA-Systems/FMPy

extra:
  recipe-maintainers:
    - t-sommer
    - wulmer
    - jschueller
