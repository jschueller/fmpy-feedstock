package:
  name: fmpy
  version: 0.3.27

source:
  # url: https://github.com/CATIA-Systems/FMPy/archive/refs/tags/v{{ version }}.tar.gz
  # sha256: c46595f5f5e5e202a85c5c44c663db66e2e283f3919944849ad62de4dbe9f6f9
  # use git because no tarball including submodules is available
  git_url: https://github.com/CATIA-Systems/FMPy.git
  git_tag: v{{ version }}

build:
  number: 0
  entry_points:
    - fmpy = fmpy.command_line:main

outputs:

  - name: fmpy-base
    script: build_base.bat  # [win]
    script: build_base.sh  # [not win]
    requirements:
      build:
        - cmake
        - {{ compiler('c') }}
        - {{ stdlib("c") }}
        - {{ compiler('cxx') }}
      host:
        - python >=3.10
        - pip
      run:
        - python >=3.10
        - attrs
        - jinja2
        - lark
        - lxml
        - msgpack-python
        - numpy
        - pywin32  # [win]
    test:
      imports:
        - fmpy
        - fmpy.cross_check
        - fmpy.examples
        - fmpy.fmucontainer
        - fmpy.modelica
        - fmpy.ssp
        - fmpy.sundials  # [not linux]

  - name: fmpy
    build:
      noarch: python
    requirements:
      run:
        - dash-bootstrap-components >=1.0.0
        - dask
        - matplotlib-base
        - notebook
        - plotly
        - pyqt
        - pyqtgraph
        - pyqtwebengine
        - python-kaleido
        - requests
        - scipy
        - {{ pin_subpackage('fmpy-base', max_pin="x.x.x") }}
    test:
      imports:
        - fmpy.gui
        - fmpy.webapp

about:
  home: https://github.com/CATIA-Systems/FMPy
  license: BSD-2-Clause
  license_family: BSD
  license_file: LICENSE.txt
  summary: Simulate Functional Mockup Units (FMUs) in Python
  doc_url: https://fmpy.readthedocs.io/
  dev_url: https://github.com/CATIA-Systems/FMPy

extra:
  recipe-maintainers:
    - t-sommer
    - wulmer
    - jschueller
